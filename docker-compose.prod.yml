services:
  backend:
    build: { context: ./backend, target: prod }
    env_file: .env
    restart: unless-stopped

  frontend:
    build: { context: ./frontend, target: prod }
    ports: ["80:80", "443:443"]
    volumes: [caddy_data:/data]
    restart: unless-stopped
    depends_on: [backend]

volumes:
  caddy_data:
